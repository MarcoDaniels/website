    <script id="__ELM_PAGES_DATA__" type="application/json">{"staticData":{"477512823":"{\"entries\":[{\"title\":\"website\",\"url\":\"/\",\"description\":\"Hi, my name is Marco Daniel Martins and I am a software engineer.\",\"image\":{\"path\":\"/2022/02/02/marco_uid_61fae7fee3685.jpg\",\"title\":\"Marco Daniel Martins\",\"mime\":\"image/jpeg\",\"width\":1693,\"height\":2255},\"content\":[{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/02/02/marco_uid_61fae7fee3685.jpg\",\"title\":\"Marco Daniel Martins\",\"mime\":\"image/jpeg\",\"width\":1693,\"height\":2255}},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Hi there \uD83D\uDC4B\\n\\nI'm Marco and welcome to my personal website.\\n\\nHere you can find a little bit more [about me and this website](/about) and you are welcome to check some of my [notes and experiments](/notes).\\n\\nHope you have fun \uD83D\uDE80\"}]}],\"_modified\":1658175191},{\"title\":\"teapot\",\"url\":\"/418\",\"description\":\"I'm a teapot! Page not found!\",\"image\":{\"path\":\"/2022/06/15/marco-jump_uid_62aa26ed1358c.jpeg\",\"title\":\"marco jump.jpeg\",\"mime\":\"image/jpeg\",\"width\":2048,\"height\":1446},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# I'm a teapot\\n\\nIt seems the page you're looking for does not exist...\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/06/15/marco-jump_uid_62aa26ed1358c.jpeg\",\"title\":\"marco jump.jpeg\",\"mime\":\"image/jpeg\",\"width\":2048,\"height\":1446}},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"Jump [into some notes](/notes) or checkout the [about page](/about).\"}],\"_modified\":1658175210},{\"title\":\"about\",\"url\":\"/about\",\"description\":\"My name is Marco Daniel Martins and I like to build stuff, mostly websites.\",\"image\":{\"path\":\"/2022/08/03/marco-pictures_uid_62eaaf993600c.jpg\",\"title\":\"marco pictures.jpg\",\"mime\":\"image/jpeg\",\"width\":1400,\"height\":1800},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# MarcoDaniel's about\\n\\nMy name is Marco Daniel Martins and I'm a software engineer. I like comic books and building things, mostly websites.\\n\\nBuilding software is both my work and my hobby, and you're looking at the culmination of my hobby - a fun and exciting journey of experiments and notes.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Why does this website exist?\\n\\nThis website exists, so I can try out some of **my** favorite technologies, write some notes about it and improve my writing skillz.\\n\\nWhat this website is:\\n- a fun and entertaining journey\\n- a place to document things that I like\\n- a super opinionated point of view\\n\\nWhat this website is **not**:\\n- top X things you should know about\\n- tool X is better than Y\\n- you should do this instead of that\\n\\nThat said, this website will focus a lot on technologies that makes **me** happy, and I hope that **you** will have fun reading it.\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/08/03/marco-pictures_uid_62eaaf993600c.jpg\",\"title\":\"marco pictures.jpg\",\"mime\":\"image/jpeg\",\"width\":1400,\"height\":1800}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Feedback\\n\\nIf you find a mistake, think I should not write something I did or believe I am super correct about everything - you can contact me on any of my social medias (links are probably in the footer) or just chat with me over a cup of coffee (or whatever you fancy).\\n\\nI purposely decided not to have a feedback (comment/reaction) section on this website as we don't want this website to become super popular and then things get out of hand easily. Or maybe that's just too complex to implement and maintain.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## What's in it for me?\\n\\nOkay, so you write this amazing super cool stuff and share it for free?\\n\\nYes! I do not plan to gain anything extra with any content I will end up writing and providing here. The only thing I hope to \\\"gain\\\" is to reach others and inspire them to do the same, share what you know and what makes you happy.\\n\\nAlso, all the source code for this website is public. Go ahead, and [check it out on github](https://github.com/MarcoDaniels/website).\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/08/03/marco_uid_62eaafa2118d6.jpeg\",\"title\":\"marco.jpeg\",\"mime\":\"image/jpeg\",\"width\":3024,\"height\":4032}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Own opinion\\n\\nUsually people say \\\"my opinions are my own\\\", but what exact does that mean?\\n\\nAren't opinions just a bunch of ideas that each one of us forms in their head about a specific subject based on their surroundings that _will_ inevitably change over time given the right learnings and circumstance? \\n\\nIf so, can my opinions **really** be my own? Did your opinion about \\\"own opinions\\\" just change from reading this opinion?\\n\\n_Anyway_, all the opinions, grammar miskates, coding errors and views on this website are mine and my selfish ego only.\"}],\"_modified\":1705743758},{\"title\":\"notes\",\"url\":\"/notes\",\"description\":\"Here's an amazing curated list of some notes I've taken!\",\"image\":{\"path\":\"/2022/08/03/marco-notes_uid_62eaaf98e7fed.jpg\",\"title\":\"marco notes.jpg\",\"mime\":\"image/jpeg\",\"width\":1400,\"height\":1400},\"content\":[{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# MarcoDaniel's notes\\n\\nHere's an amazing curated list of some notes and experiments we have made! \\n\"}]},{\"field\":{\"type\":\"collectionlink\",\"label\":\"Reference\"},\"value\":[{\"title\":\"elm AWS CloudFront\",\"url\":\"/note/elm-aws-cloudfront\",\"description\":\"Building AWS Lambda@Edge functions in CloudFront with Elm. \",\"image\":{\"path\":\"/2024/01/20/elm-aws-cloudfront_uid_65abe6a790a66.jpg\",\"title\":\"elm-aws-cloudfront.jpg\",\"mime\":\"image/jpeg\",\"width\":2720,\"height\":2304}},{\"title\":\"elm robots and humans\",\"url\":\"/note/elm-robots-and-humans\",\"description\":\"Building type-safe and structured robots.txt and humans.txt files with Elm.\",\"image\":{\"path\":\"/2022/12/13/elm-robots-humans_uid_6398d558df40f.jpg\",\"title\":\"elm-robots-humans.jpg\",\"mime\":\"image/jpeg\",\"width\":2648,\"height\":1488}},{\"title\":\"developing with nix\",\"url\":\"/note/developing-with-nix\",\"description\":\"Setting up nix to manage development toolchain, dependency versioning and package management.\",\"image\":{\"path\":\"/2022/11/15/developing-with-nix_uid_6373f1b10a2f2.jpg\",\"title\":\"developing-with-nix.jpg\",\"mime\":\"image/jpeg\",\"width\":2580,\"height\":1860}},{\"title\":\"vanilla extract forall\",\"url\":\"/note/vanilla-extract-forall\",\"description\":\"Using vanilla-extract to write type-safe styles, themes and design systems for multiple UI frameworks.\",\"image\":{\"path\":\"/2022/10/19/vanilla-extract-forall_uid_635040c041b63.jpg\",\"title\":\"vanilla-extract-forall.jpg\",\"mime\":\"image/jpeg\",\"width\":3256,\"height\":1412}},{\"title\":\"elm headless worker\",\"url\":\"/note/elm-headless-worker\",\"description\":\"Experiments with Elm headless worker in some JavaScript runtimes.\",\"image\":{\"path\":\"/2022/09/02/elm-server_uid_63126d029beea.jpg\",\"title\":\"elm-server.jpg\",\"mime\":\"image/jpeg\",\"width\":2884,\"height\":1784}},{\"title\":\"environment variables in node.js\",\"url\":\"/note/environment-variables-in-node-js\",\"description\":\"Handle environment variables in a Node.js application.\",\"image\":{\"path\":\"/2022/08/03/environment-decoder_uid_62eaa07d85ff1.png\",\"title\":\"environment-decoder.png\",\"mime\":\"image/png\",\"width\":936,\"height\":446}}]}],\"_modified\":1705766629},{\"title\":\"environment variables in node.js\",\"url\":\"/note/environment-variables-in-node-js\",\"description\":\"Handle environment variables in a Node.js application.\",\"image\":{\"path\":\"/2022/08/03/environment-decoder_uid_62eaa07d85ff1.png\",\"title\":\"environment-decoder.png\",\"mime\":\"image/png\",\"width\":936,\"height\":446},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Environment Variables in Node.js\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"When building software applications, we will have to deal with environment variables at some point.\\n\\nIn this note we will look into how _easily_ we can handle [environment variables](https://nodejs.dev/learn/how-to-read-environment-variables-from-nodejs) (`process.env`) in a [Node.js](https://nodejs.org/) application.\\n\\n\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/08/03/environment-decoder_uid_62eaa07d85ff1.png\",\"title\":\"environment-decoder.png\",\"mime\":\"image/png\",\"width\":936,\"height\":446}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> I don't want to be a product of my environment. I want my environment to be a product of me.\\n>\\n> -- Frank Costello, The Departed\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Environment & Variables\\n\\nAn __environment__ can be defined as a group of conditions in which a system or application operates, usually an environment is named _\\\"local\\\"_, _\\\"developement\\\"_, _\\\"production\\\"_, etc. \\n\\nA group of conditions that determinates and defines this environment is called __\\\"environment variables\\\"__.\\n\\nAn __environment variable__ is a value that can affect the way an application runs, this value is constant at runtime and it only changes in between environments.\\n\\nSome of the most common use cases are:\\n- a PORT on where the application is running\\n- API key to fetch data\\n- credentials to connect to a database\\n\\nEnvironment variables usually contain sensitive and personal information (fx: authentication), we always need to be cautious on how to use them.\\n\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"\\n## Set environment variables\\n\\nThe most common way to set environment variables is with [`.env` (dotenv) files](https://github.com/motdotla/dotenv), we will have to install the dependency in order to source the environment into our code.\\n\\nWe can also pass the value of the variable in the \\\"`scripts`\\\" in \\\"`package.json`\\\", we just need to be aware those values will be clear text in version control and will overwrite the value.\\n\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```\\n# .env\\nBASE_URL=https://marcodaniels.com\\nMY_ENV=true\\n\\n# dev.env\\nBASE_URL=https://dev.marcodaniels.com\\nMY_ENV=false\\n\\n# package.json\\n{\\n  \\\"scripts\\\": {\\n    \\\"start\\\": \\\"MY_ENV=false run application\\\"\\n  }\\n}\\n```\"}]},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```\\nif (process.env.MY_ENV!) {\\n    // do something\\n}\\n\\nconst base = process.env.BASE_URL || ''\\nfetch(`${baseURL}/api`)\\n\\t.then(res => res.json())\\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Use environment variables\\n\\nAll environment variables are set to the global [`process.env`](https://nodejs.dev/learn/how-to-read-environment-variables-from-nodejs) property and their values can be accessed from anywhere in our application.\\n\\nWe will have to make 100% sure the variables name and value are set correctly in our application in all environments, otherwise we might find some not-so-funny problems to debug.\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Environment Decoder\\n\\n[environment-decoder](https://www.npmjs.com/package/environment-decoder) is a small library that allows us to define a simple decoder and the type of the environment variables we need for our application to run.\\n\\n> Decoding is the process of converting code into plain text or any format that is useful for subsequent processes.\\n\\nLet's have a look at it:\\n```\\nconst myEnv = environmentDecoder({\\n    BASE_URL: asString,\\n    PORT: asNumber,\\n    FEATURE_FLAG: asBoolean,\\n    OPTIONAL_FLAG: asString.withDefault('OPTION_1')\\n})\\n```\\n\\nIn the example above, not only we're validating that all the environment variables **are set**, we're also making sure their types are correct.\\n\\nThe value `myEnv.FEATURE_FLAG` is a boolean for **sure** and there's no need to cast `Boolean(myEnv.FEATURE_FLAG)`, for optional variables the `withDefault(...)` method allows us to define a fallback value at the decoder level.\\n\\n\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Environment Decoder with TypeScript\\n\\nWhen using [TypeScript](https://www.typescriptlang.org/) we can create a type for our decoder with `DecodeType`:\\n\\n```\\nimport {environmentDecoder, asString, DecodeType} from 'environment-decoder'\\n\\nconst myEnv = environmentDecoder({\\n    BASE_URL: asString,\\n    API_KEY: asString,\\n})\\n\\ntype EnvironmentType = DecodeType<typeof myEnv>\\n```\\n\\nWe can also create multiple decoders and use the `DecodeType` to create a function paramater:\\n\\n```\\nimport {environmentDecoder, asString, asBoolean, DecodeType} from 'environment-decoder'\\n\\nconst baseEnv = environmentDecoder({\\n    FEATURE_FLAG: asBoolean\\n})\\n\\nconst myAPIEnv = environmentDecoder({\\n    BASE_URL: asString,\\n    API_KEY: asString,\\n})\\n\\ntype MyAPIType = DecodeType<typeof myAPIEnv>\\n\\nconst myAPIFetch = (params: MyAPIType) =>\\n    fetch(`${params.BASE_URL}/v1/api`, {\\n        method: 'POST',\\n        headers: {\\n            'X-API-KEY': params.API_KEY,\\n        }\\n    })\\n    .then(response => response.json())\\n    \\nmyAPIFetch(myAPIEnv)\\n```\\n\\nThis allows us to write the interface for the functions that require environment variables in a clean and safe way without the need of duplication.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Environment Decoder Exceptions\\n\\nThe way [environment-decoder](https://www.npmjs.com/package/environment-decoder) makes **sure** the environment variables and their types are set correctly is by [throwing an exception](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/throw) at runtime.\\n\\nThis behaviour would be very similar without `environment-decoder` as the places where the variables are used would probably throw an exception. The main difference is that now we are able to catch all these errors in one place.\\n\\nThe cases where the exceptions will happen are:\\n- the environment variable is not set and there is no `.withDefault()`\\n- the environment variable value does not match the type defined (using `asNumber` on a value `abcde`)\\n\\nIt is recommended that we use `environmentDecoder` as close as possible to the start of our application. This way we can catch all erros as early as possible.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this! Go ahead and check the [source code for environment decoder on GitHub](https://github.com/MarcoDaniels/environment-decoder).\\n\\nUntil then!\\n\\n\"}]}],\"_modified\":1660242127},{\"title\":\"elm headless worker\",\"url\":\"/note/elm-headless-worker\",\"description\":\"Experiments with Elm headless worker in some JavaScript runtimes.\",\"image\":{\"path\":\"/2022/09/02/elm-server_uid_63126d029beea.jpg\",\"title\":\"elm-server.jpg\",\"mime\":\"image/jpeg\",\"width\":2884,\"height\":1784},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Elm Headless Worker\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"[Elm](https://elm-lang.org/) is a functional programming language that compiles to [JavaScript](https://developer.mozilla.org/en-US/docs/Web/JavaScript), it is _mainly_ used to build browser and user interface applications. It is [purely functional](https://en.wikipedia.org/wiki/Purely_functional_programming) with a very strong type system and error handling, allowing us to build reliable and robust web applications.\\n\\nIn this note we will look into the [`Platform.worker`](https://package.elm-lang.org/packages/elm/core/latest/Platform#worker) and we will experiment Elm code in some JavaScript runtimes. \\n\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/09/02/elm-server_uid_63126d029beea.jpg\",\"title\":\"elm-server.jpg\",\"mime\":\"image/jpeg\",\"width\":2884,\"height\":1784}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> I know what everyone's gonna say. But they're already saying it. We're mad scientists. We're monsters, buddy. We've gotta own it. Make a stand. It's not a loop. It's the end of the line.\\n>\\n> -- Tony Stark, Avengers: Age of Ultron\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Elm Worker\\n\\nAn Elm worker contains the _core_ functionality of any Elm program:\\n\\n```elm\\nworker :\\n  { init : flags -> ( model, Cmd msg )\\n  , update : msg -> model -> ( model, Cmd msg )\\n  , subscriptions : model -> Sub msg\\n  }\\n  -> Program flags model msg\\n```\\n\\n- an initial state `init` that represents the starting point of our program\\n- an `update` function that reacts to events that happen within our program\\n- a list of `subscriptions` that can react to events that happen outside our program\\n\\nIt basically contains the \\\"brain\\\" of the application and it is very useful when we want Elm to make the calculations and logic without the need of a user interface.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Ports and JavaScript interop\\n\\n[Ports](https://guide.elm-lang.org/interop/ports.html) are the way we can communicate back and forward between our Elm code and any other JavaScript code.\\n\\nIn the following example we have 2 ports:\\n\\n- `input` the port that listens (subscribes) to events outside the Elm code. It decodes the input value to a `String`.\\n- `output` the port that sends events from the Elm code to JavaScript. It encodes the output value to a `String`.\\n\\n\\n```elm\\n-- Simple.elm\\nport module Simple exposing (main)\\n\\nport input : (Decode.Value -> msg) -> Sub msg\\nport output : Encode.Value -> Cmd msg\\n\\ntype Msg\\n  = Incoming (Result Error String)\\n\\nmain =\\n  Platform.worker\\n    { init = \\\\_ -> ( (), Cmd.none )\\n      , update =\\n        \\\\msg model ->\\n          case msg of\\n            Incoming arg ->\\n              case arg of\\n                Ok response ->\\n                  ( model, \\\"Hello \\\" ++ response |> Encode.string |> output )\\n                Err err ->\\n                  ( model, Decode.errorToString err |> Encode.string |> output )\\n      , subscriptions =\\n        \\\\_ ->\\n          Decode.decodeValue Decode.string >> Incoming |> input\\n    }\\n```\\n\\nThe JavaScript code to interact with the Elm worker looks something like this:\\n\\n```javascript\\n// simple.js\\nconst {Elm} = require('simple')\\nconst app = Elm.Simple.init()\\n\\napp.ports.input.send('World')\\n\\napp.ports.output.subscribe((content) => {\\n    console.log(content)\\n})\\n```\\n\\nHere we communicate with our Elm code by sending data into our `input` port and subscribing for data to our `output` port.\\n\\nWhen we compile the Elm code everything becomes \\\"just JavaScript\\\" and then we can run it with [the Node.js runtime](https://nodejs.dev/) as simple as `node simple.js` and it will output \\\"Hello World\\\".\\n\\nAnd that's about **it**, we just ran \\\"backend\\\" code with a \\\"frontend\\\" programming language \uD83E\uDD2F!\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## It is _just_ JavaScript\\n\\nSo we can use Elm code as the \\\"logic\\\" for any [Node.js](https://nodejs.dev/) application?\\n\\nWhat if we would like to build a very simple server in Node.js _but_ we would let Elm handle all the logic of rendering the pages?\\n\\nLet's have a look at some code.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```javascript\\nconst http = require('http')\\nconst {Elm} = require('server')\\n\\nconst app = Elm.Server.init()\\n\\nhttp.createServer((req, res) => {\\n  const outputCaller = (elmResponse) => {\\n    res.writeHead(elmResponse.statusCode, {'Content-Type': 'text/html'})\\n    res.end(elmResponse.body)\\n\\n    app.ports.output.unsubscribe(outputCaller)\\n  }\\n   \\n  app.ports.output.subscribe(outputCaller)\\n  app.ports.input.send(req)\\n}).listen(8000)\\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"In our JavaScript code we would have to create a server and we can use the [Node.js http module](https://nodejs.org/docs/latest-v17.x/api/http.html#httpcreateserveroptions-requestlistener). This allows us to create the server in a specific port and handle requests and responses.\\n\\nIt makes it pretty easy to _source_ all the logic of the response into the Elm ports.\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"In our Elm code there's a bit more to unpack.\\n\\nWe will have to define an `Input` and `Output` type with the respectives decoder/encoder so we can handle the incoming and outgoing data.\\n\\nWith the incoming data we can _easily_ build a `router` to handle every `url` the user navigates and return the data to be printed out in the page.\\n\\nAs Elm forces us to make sure all corner cases are handled (no runtime exceptions) we can make sure our router \\\"just works\\\".\\n\\n```elm\\nport module Server exposing (main)\\n\\nport input : (Decode.Value -> msg) -> Sub msg\\nport output : Encode.Value -> Cmd msg\\n\\ntype alias Input = { url : String, method : String }\\n\\ntype alias Output = { statusCode : Int, body : String }\\n\\ntype Msg = Incoming (Result Error Input)\\n\\nresult { statusCode, body } =\\n  Encode.object\\n    [ ( \\\"statusCode\\\", Encode.int statusCode )\\n    , ( \\\"body\\\", Encode.string body )\\n    ] |> output\\n\\nrouter arg =\\n  case arg of\\n    Ok { url, method } ->\\n      case String.split \\\"/\\\" url of\\n        _ :: [ \\\"\\\" ] ->\\n          result\\n            { statusCode = 200, body = \\\"<h1>Home page</h1>\\\" }\\n\\n        _ :: [ \\\"about\\\" ] ->\\n          result\\n            { statusCode = 200, body = \\\"<h1>About page</h1>\\\" }\\n\\n        _ ->\\n          result\\n            { statusCode = 404, body = \\\"<h1>Not found</h1>\\\" }\\n\\n    Err err ->\\n      result\\n        { statusCode = 503, body = Decode.errorToString err }\\n\\nmain =\\n  Platform.worker\\n    { init = \\\\_ -> ( (), Cmd.none )\\n    , update =\\n      \\\\msg _ ->\\n        case msg of\\n          Incoming arg ->\\n            ( (), router arg )\\n    , subscriptions =\\n      \\\\_ ->\\n        Decode.decodeValue\\n          (Decode.map2 Input\\n            (Decode.field \\\"url\\\" Decode.string)\\n            (Decode.field \\\"method\\\" Decode.string)\\n          )\\n          >> Incoming |> input\\n    }\\n```\\n\\nThis was a lot! But hey, after compiling the Elm code we can just run `node server.js` and there will be a server with a couple of routes and all the routing and rendering is handled in Elm.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## What about Deno?\\n\\n[Deno](https://deno.land/) is a JavaScript runtime with TypeScript support out of the box and secure by default.\\n\\nIn order to write a Deno server with Elm we can just create a TypeScript file and make sure we're enabling JavaScript modules in our code.\\n\\n```typescript\\nimport {createRequire} from \\\"https://deno.land/std/node/module.ts\\\"\\n\\nconst denoServer = Deno.listen({port: 8000})\\n\\nconst require = createRequire(import.meta.url)\\nconst {Elm} = require('../dist/ServerElm')\\n\\nconst app = Elm.DenoServer.init()\\n\\nasync function serveHttp(conn: Deno.Conn) {\\n  const httpConn = Deno.serveHttp(conn)\\n\\n  for await (const requestEvent of httpConn) {\\n    const outputCaller = (elmResponse: { statusCode: number, body: string }) => {\\n      requestEvent.respondWith(new Response(elmResponse.body, {\\n        status: elmResponse.statusCode,\\n        headers: {'Content-Type': 'text/html'}\\n      }))\\n      app.ports.output.unsubscribe(outputCaller)\\n    }\\n    app.ports.output.subscribe(outputCaller)\\n    app.ports.input.send(requestEvent.request)\\n  }\\n}\\n\\nfor await (const conn of denoServer) {\\n  void serveHttp(conn)\\n}\\n```\\n\\nOn the Elm side of things, we only need to make a small change in our codebase in order to get the proper path of the URL. For that, we just need to parse the URL given by Deno's request event and extract the path:\\n\\n```elm\\npath =\\n  (Url.fromString url\\n    |> Maybe.withDefault\\n      { protocol = Https\\n      , host = \\\"\\\"\\n      , port_ = Nothing\\n      , path = \\\"\\\"\\n      , query = Nothing\\n      , fragment = Nothing\\n      }\\n  ).path\\n```\\n\\nAfter compiling the Elm code, we can just run the server with `deno run --allow-read --allow-env=NODE_DEBUG --allow-net denoServer.ts` and we will have a Deno server with all the routing and rendering handled in Elm.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## What about Bun?\\n\\n[Bun](https://bun.sh/) is a new (depending on when you're reading this) JavaScript runtime with a huge potential, especially in terms of _speed_!\\n\\nTo build a server in Bun is pretty simple as it is built on top of web standards like [Request](https://developer.mozilla.org/en-US/docs/Web/API/Request) and [Response](https://developer.mozilla.org/en-US/docs/Web/API/Response).\\n\\n```\\nconst {Elm} = require('../dist/ServerElm.js')\\n\\nconst app = Elm.BunServer.init()\\n\\nBun.serve({\\n  fetch(request) {\\n    const response = {body: '', statusCode: 200}\\n\\n    const outputCaller = (elmResponse) => {\\n      response.body = elmResponse.body\\n      response.statusCode = elmResponse.statusCode\\n      app.ports.output.unsubscribe(outputCaller)\\n    }\\n    app.ports.output.subscribe(outputCaller)\\n    app.ports.input.send({url: request.url, method: request.method})\\n\\n    return new Response(response.body, {\\n      status: response.statusCode,\\n      headers: {'Content-Type': 'text/html'}\\n    })\\n  },\\n  port: 8000,\\n})\\n```\\n\\nIn this case we can still use the **same** Elm code as in the previous example, but in our JavaScript code we'll have to modify the response object when our subscription receives data from the Elm code as we need to **return** a Response instead of using the callback method.\\n\\nAfter compiling the Elm code we can just run the server with `bun run bunServer.js` and all our pages will be routed and rendered with Elm code.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Now draw the rest of the owl!\\n\\nSo, turns out it is pretty easy to run Elm code as a `backend` of our application. Basically, **any** programming language that compiles to JavaScript should be able to run in **any** JavaScript runtime, (sadly) there's no magic to it. \\n\\n\\nIn our examples the cases were quite simple, and we have some hardcoded HTML as `String` in order to _build a page_ `{ statusCode = 200, body = \\\"<h1>Home page</h1>\\\" }` a [library like elm-html-string](https://package.elm-lang.org/packages/zwilias/elm-html-string/latest) would allow us to actually build a _proper_ HTML page and then render it without the need of hardcoded strings, we could probably also expose a `/api/content` route and output the content as [JSON](https://www.json.org/json-en.html), or maybe even go off the rails and expose some XML.\\n\\nBut let's leave that for another time \uD83D\uDE06\\n\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this! Go ahead and check the [source code used for all this examples on GitHub](https://github.com/MarcoDaniels/elm-headless-worker).\\n\\nUntil then!\"}]}],\"_modified\":1662324030},{\"title\":\"vanilla extract forall\",\"url\":\"/note/vanilla-extract-forall\",\"description\":\"Using vanilla-extract to write type-safe styles, themes and design systems for multiple UI frameworks.\",\"image\":{\"path\":\"/2022/10/19/vanilla-extract-forall_uid_635040c041b63.jpg\",\"title\":\"vanilla-extract-forall.jpg\",\"mime\":\"image/jpeg\",\"width\":3256,\"height\":1412},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Vanilla-Extract forall\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"[Vanilla-Extract](https://vanilla-extract.style/) is a CSS preprocessor that allows us to write stylesheets in TypeScript and generate static CSS files during build time.\\n\\nIn this note we will look into creating a very simple set of tools and themes to be used by several frontend libraries/languages.\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/10/19/vanilla-extract-forall_uid_635040c041b63.jpg\",\"title\":\"vanilla-extract-forall.jpg\",\"mime\":\"image/jpeg\",\"width\":3256,\"height\":1412}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> Oh, nothing, Tommy. It's tiptop. It's just I'm not sure about the colour.\\n>\\n> -- Turkish, Snatch\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Cascading Style Sheets\\n\\nCSS is a [style sheet language](https://developer.mozilla.org/en-US/docs/Web/CSS) that allows us to create styles for our websites. Just like the one we're looking at right now. \\n\\nThe CSS syntax consists on basic _\\\"property-value\\\"_ pair (aka: declaration) and together with other declarations we can create blocks in a `.css` file or in a `<style>` tag and then apply the styles to one or multiple [HTML](https://developer.mozilla.org/en-US/docs/Web/HTML) elements.\\n\\nThe [value definition syntax](https://developer.mozilla.org/en-US/docs/Web/CSS/Value_definition_syntax) of a CSS property can be quite a _special thing_ as it can differ a lot from property to property and the only way to check its correctness is to try it on a webpage.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```css\\n.box {\\n    border: 2px solid;\\n    background-color: #FFF;\\n    color: #1F1926;\\n    font-size: 1.05rem;\\n    padding: 10px 15px;\\n    margin-top: 15px;\\n    margin-bottom: 15px;\\n}\\n```\\n\\n```html\\n<div class=\\\"box\\\">\\n    Example goes here.\\n</div>\\n```\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## CSS-in-JS\\n\\nFor many years, we have been using tools like [Sass](https://sass-lang.com/), [PostCSS](https://postcss.org/), [Less](https://lesscss.org/) and others [as preprocessors](https://developer.mozilla.org/en-US/docs/Glossary/CSS_preprocessor) to create styles in a more reusable and scalable way. These amazing tools gave us great powers and abilities to create design systems to be used and re-used across multiple applications.\\n\\n> For the times they are a-changin'\\n\\n[CSS-in-JS](https://en.wikipedia.org/wiki/CSS-in-JS) is a way of writing our styles in [JavaScript](https://developer.mozilla.org/en-US/docs/Web/JavaScript) and similar to the CSS preprocessors it gave us amazing abilities to create reusable styles, in this case, using the same language and \\\"next-to\\\" the elements the styles apply. This approach gain big traction and popularity with the rise of [\\\"_modern frameworks_\\\"](https://www.dictionary.com/browse/modern) like React.js, Vue.js and others.\\n\\n```jsx\\nconst MyButton = styled.p`\\n  color: pink;\\n  padding: 10px;\\n`;\\n\\n<MyButton>My button is pink!</MyButton>\\n```\\n\\nWe usually say that \\\"_with great power comes technical dept_\\\" and with CSS-in-JS came larger bundles of JavaScript that have to execute styles at runtime.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Zero-runtime Stylesheets in TypeScript\\n\\n[Vanilla-extract](https://vanilla-extract.style/) is \\\"Zero-runtime Stylesheets in TypeScript\\\", and that means we get all the benefits of a typed language and none of the runtime costs. Let's look at some API examples from vanilla-extract. \\n\\nThe `style` API allows us to create CSS declarations, just like in good old CSS with the advantage of being in [TypeScript](https://www.typescriptlang.org/), the generated code will be a scoped CSS class that we can just apply to any HTML element.\\n\\nThe `createTheme` API allows us to create and extend themes that will generate locally scoped [CSS variables](https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties) to be used within the `style` API.\\n\\nThere's many more API provided by vanilla-extract, like [`styleVariants`](https://vanilla-extract.style/documentation/api/style-variants/) and [`createContainer`](https://vanilla-extract.style/documentation/api/create-container/), but we will keep our examples based on the `style` and `createTheme`.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```typescript\\nconst box = style({\\n  border: '2px solid',\\n  backgroundColor: '#FFF',\\n  color: '#1F1926',\\n  padding: '10px 15px'\\n})\\n\\n<div class={box}>\\n    Example goes here.\\n</div>      \\n```\\n\\n\\n```typescript\\nconst [baseTheme, vars] = createTheme({\\n  color: {\\n    brand: '#000',\\n    primary: '#000',\\n  },\\n  background: {\\n    primary: '#FFF'\\n  }\\n})\\n\\nconst themeReact = createTheme(vars, {\\n  color: {\\n    brand: '#61dafb',\\n    primary: '#FFF'\\n  },\\n  background: {\\n    primary: '#20232a'\\n  }\\n})\\n\\nconst box = style({\\n  backgroundColor: vars.background.primary,\\n  color: vars.color.primary\\n})\\n```\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Sprinkles & Recipes\\n\\nVanilla-extract also allows us to build CSS frameworks on top of it, some examples would be [sprinkles](https://vanilla-extract.style/documentation/packages/sprinkles/) and [recipes](https://vanilla-extract.style/documentation/packages/recipes/).\\n\\nWith `createSprinkles` we can create a set of atomic properties to be consumed by any client application, for example:\\n\\n```typescript\\nexport const sprinkles = createSprinkles(defineProperties({\\n    defaultCondition: 'small',\\n    conditions: {\\n        small: {},\\n        large: {'@media': '(min-width: 800px)'}\\n    },\\n    properties: {\\n        color: themeVars.color,\\n        backgroundColor: themeVars.background,\\n        display: ['flex', 'grid'],\\n        alignItems: ['center'],\\n        paddingTop: themeVars.space,\\n        paddingBottom: themeVars.space,\\n        paddingLeft: themeVars.space,\\n        paddingRight: themeVars.space,\\n    },\\n    shorthands: {\\n        padding: ['paddingTop', 'paddingBottom', 'paddingLeft', 'paddingRight']\\n    }\\n}))\\n```\\n\\nCreates a `sprinkles` function that then can be used to apply a limited amount of properties to an element:\\n\\n```\\n<div class={sprinkles({display: {small: 'flex', large: 'grid'}})}>\\n    Example goes here.\\n</div>   \\n```\\n\\nWe can also use the `sprinkle` utility together with `recipe`.\\n\\nRecipe allows us to create a multi-variant utility function and use it to create specific variants for our elements:\\n\\n```\\nexport const box = recipe({\\n    base: sprinkles({\\n        paddingTop: 'large',\\n        color: 'primary',\\n        backgroundColor: 'primary'\\n    }),\\n    variants: {\\n        border: {\\n            some: sprinkles({border: 'some', borderRadius: 'some'}),\\n            none: sprinkles({border: 'none'})\\n        }\\n    }\\n})\\n```\\n\\nAnd then we can use it as:\\n\\n```\\n<div class={box({border: 'some'})}>\\n    Example goes here.\\n</div>   \\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Use it _without_ a framework\\n\\nAfter we build a couple of `themes`, `sprinkles` and `recipes`, it comes the time to implement a small UI.\\n\\nWe first go with _just HTML_ and build a very small example just like:\\n\\n```\\nconst body = document.querySelector<HTMLDivElement>('body')!\\nbody.className = baseTheme\\n\\nconst app = document.createElement('div')\\n\\napp.innerText = 'Example'\\napp.className = box({type: 'center', border: 'some'})\\n\\nbody.appendChild(app)\\n```\\n\\nTo implement this example we just need a build tool to integrate with vanilla-extract, we can use [`@vanilla-extract/vite-plugin`](https://vanilla-extract.style/documentation/integrations/vite/) for example.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Use it with _any_ framework\\n\\nWe can also use vanilla-extract with any other framework (React, Vue, Svelte, etc), we just need to make sure to configure the build tool so we can use vanilla-extract.\\n\\nAn example with [Svelte](https://svelte.dev/) would be:\\n\\n```\\n<script lang=\\\"ts\\\">\\n    import {box, text, themeSvelte} from 'vanilla'\\n<\/script>\\n\\n<main class={`${themeSvelte} ${box({type: 'center', border: 'some'})}`}>\\n    <h2 class={text({type: 'brand'})}>Svelte</h2>\\n</main>\\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Just like CSS\\n\\nBeing able to create a design system with multiple themes, utilities and variants that can be used across multiple clients without the overhead of being dependent to a specific UI framework, feels like we're just writing CSS. \\n\\nPlus, we get all the advantages of using TypeScript to make sure all out properties and values are validated at build time.\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this! Go ahead and check the [source code of some examples on GitHub](https://github.com/MarcoDaniels/vanilla-extract-forall) with a few frontend frameworks.\\n\\nYou can also see the examples in action in the [output website](https://marcodaniels.github.io/vanilla-extract-forall/).\\n\\nUntil then!\"}]}],\"_modified\":1667847982},{\"title\":\"developing with nix\",\"url\":\"/note/developing-with-nix\",\"description\":\"Setting up nix to manage development toolchain, dependency versioning and package management.\",\"image\":{\"path\":\"/2022/11/15/developing-with-nix_uid_6373f1b10a2f2.jpg\",\"title\":\"developing-with-nix.jpg\",\"mime\":\"image/jpeg\",\"width\":2580,\"height\":1860},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Developing with Nix\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"[Nix](https://nixos.org/) is a tool to define and manage packages and dependencies in an explicit and reproducible way. It is also the name of the [programming language](https://nixos.wiki/wiki/Overview_of_the_Nix_Language) used to create these definitions, and it is also a [Linux distribution](https://en.wikipedia.org/wiki/NixOS).\\n\\nIn this note we will have a look on how to use Nix to configure all our development setup.\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/11/15/developing-with-nix_uid_6373f1b10a2f2.jpg\",\"title\":\"developing-with-nix.jpg\",\"mime\":\"image/jpeg\",\"width\":2580,\"height\":1860}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> Gentlemen, you are looking through a window... into another world.\\n>\\n> -- Dr. Walter Bishop, Fringe\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Toolchain\\n\\nA [toolchain](https://en.wikipedia.org/wiki/Toolchain) is a collection of programming tools(software) we need in order to create _any_ type of software, usually, these tools are installed globally in our machines and that just makes it very easy to \\\"forget\\\" about them.\\n\\nWe've all installed [Node.js](https://nodejs.dev/en/), we probably gave a try to [Rust](https://www.rust-lang.org/) and [Go](https://go.dev/), [Terraform](https://www.terraform.io/) seems great for infrastructure and [dhall](https://dhall-lang.org/) looks pretty cool for configurations.\\n\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"```\\nnpm init {some-framework}\\n\\nnpx {some-npm-package}\\n\\nbrew install {tool}\\n\\ncurl {path-to-some-tool}.com | sh\\n\\n{click-here to download and extract}\\n```\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Package manager\\n\\n[Nix](https://nixos.org/) is _yet another_ tool in our toolchain with a key feature of allowing us to define our tools and dependencies as [nix packages](https://github.com/NixOS/nixpkgs).\\n\\n```\\nwith import <nixpkgs> { };\\n\\npkgs.mkShell {\\n  buildInputs = with pkgs; [\\n    pkgs.terraform\\n    pkgs.go\\n    pkgs.nodejs-16_x\\n    pkgs.yarn\\n  ];\\n}\\n```\\n\\nWith the [nix language](https://nixos.wiki/wiki/Overview_of_the_Nix_Language) we can create expressions to define all our tools and dependencies.\\n\\nIn the above example we are starting a [`nix-shell`](https://nixos.org/manual/nix/stable/command-ref/nix-shell.html) that contains the latest Terraform, Go, Yarn and the Node.js version 16.x (latest within version 16).\\n\\nWe can search for tools and their versions by running the command `nix-env -qaP {toolName}` or by searching for the tool in [nix packages](https://search.nixos.org/packages).\\n\\n```\\n$ nix-env -qaP terraform\\n\\nnixpkgs.terraform_0_12   terraform-0.12.31\\nnixpkgs.terraform_0_13   terraform-0.13.7\\nnixpkgs.terraform_0_14   terraform-0.14.11\\nnixpkgs.terraform_0_15   terraform-0.15.5\\nnixpkgs.terraform        terraform-1.0.11\\nnixpkgs.terraform_1_0_0  terraform-1.0.11\\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Pure Shell\\n\\n[Nix-shell](https://nixos.org/manual/nix/stable/command-ref/nix-shell.html) is an interactive shell based on a Nix expression containing all the specified packages, versions and dependencies.\\n\\nWe can start a `nix-shell` from a nix expression, given the file `shell.nix` with the following contents, we just need to run the command `nix-shell shell.nix` or just `nix-shell` (it will pick up the nix file expression).\\n\\n```nix\\nwith import <nixpkgs> { };\\n\\npkgs.mkShell {\\n  buildInputs = with pkgs; [\\n    pkgs.deno\\n  ];\\n}\\n```\\nThis will start a nix-shell with the latest version of [`deno`](https://deno.land/), **but** it will also contain all the global packages and tools installed in our machine, if our application requires [`terraform`](https://www.terraform.io/) and we have installed it globally we will not know about it until we try it in a different machine.\\n\\nWith the command `nix-shell --pure` or `nix-shell shell.nix --pure` we can guarantee that **only** the dependencies and versions defined in our `buildInputs` are available, so in the above case we will **only** have the `deno` cli available in the nix-shell, nothing more.\\n\\nWe can also start an interactive [nix-shell](https://nixos.org/manual/nix/stable/command-ref/nix-shell.html) without the need of creating a nix expression, we can just write the command `nix-shell -p deno --pure` and we will have a pure shell with the latest version of [`deno`](https://deno.land/). \"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Scripting\\n\\nMost applications need scripts to help on some day-to-day tasks, sometimes we just create a `myScript.sh` file to help with those tasks, other times when we are using [Node.js](https://nodejs.dev/) we just abuse the utility of `scripts` in `package.json`.\\n\\n```json\\n{\\n  \\\"name\\\": \\\"very simple tool\\\",\\n  \\\"scripts\\\": {\\n    \\\"postinstall\\\": \\\"doSomething\\\",\\n    \\\"cleanup\\\": \\\"cd somewhere && rm -rf something\\\",\\n    \\\"before\\\": \\\"yarn clean && ./myScript.sh\\\",\\n    \\\"build\\\": \\\"yarn before && buildSomething\\\"\\n  }\\n}\\n```\\n\\nWith Nix we can just create a `writeScriptBin` or `writeScriptBin` and make sure our scripts part of our shell and our packages. We can also use any programming language to write the scripts by defining the environment.\\n\\n\\n```nix\\nwith import <nixpkgs> {};\\n\\nlet\\n  update = pkgs.writeShellScriptBin \\\"update\\\" ''\\n  \\t#!/usr/bin/env node\\n    console.log('we run node here')\\n  '';\\n\\n   build = pkgs.writeScriptBin \\\"build\\\" ''\\n   \\t${pkgs.yarn}/bin/yarn\\n   \\t${pkgs.yarn}/bin/yarn build\\n   '';\\nin\\n\\npkgs.mkShell {\\n  buildInputs = with pkgs; [\\n    pkgs.terraform\\n    pkgs.nodejs-16_x\\n    pkgs.yarn\\n    update\\n    build\\n  ];\\n}\\n```\\n\\nIn this example we have a `build` and `update` script that use tools from the list of packages and are available in our shell. We can just run the command `nix-shell --pure --run \\\"build\\\"` and we will see the `console.log`.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Pinning Nixpkgs\\n\\nSo far, we are using Nix expressions with `with import <nixpkgs> {};` as a starting point of our packages, although this is an easy and fast way to showcase a Nix expression it is **not** the best way to make sure our expression is fully reproducible and it will make our application conditioned to the [nix channel version](https://status.nixos.org/) that was installed in our machine.\\n\\nTo make sure our Nix expression is fully reproducible independent of when or where we run our application we should pin our Nix expression to a specific Nix channel:\\n\\n```\\nlet\\n  pkgs = import (fetchTarball {\\n    name = \\\"nixpkgs-22.05-darwin\\\";\\n    url = \\\"https://github.com/NixOS/nixpkgs/archive/2b37d567bb7e.tar.gz\\\";\\n    sha256 = \\\"1bmy61s15grwa86i6s8q47zqxvnbchjyv0gby2484rsa35v1dw6p\\\";\\n  }) { };\\n\\nin pkgs.mkShell {\\n  buildInputs = [\\n    pkgs.nixfmt\\n    pkgs.deno\\n    pkgs.nodejs\\n  ];\\n}\\n```\\n\\nIn order to obtain the available channels we can visit [Nix Channel Status](https://status.nixos.org/) and select the `nixpkgs-...` stable or unstable version, with the commit ID we can now pin our packages and retrieve the `sha256` value by running the command: \\n\\n```\\nnix-prefetch-url --unpack https://github.com/NixOS/nixpkgs/archive/{commit-id}.tar.gz\\n```\\n\\nWe can also find older Nix channel status for more legacy applications in the [channels repository](https://channels.nixos.org/).\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Building\\n\\nStart a interactive shell with all the required dependencies seems pretty easy, **but** if we want to have a _fully reproducible_ we will have to make sure Nix _knows_ about our application packages, and that can differ if we're using [npm](https://www.npmjs.com/) or [go](https://go.dev/ref/mod) or [python](https://pypi.org/).\\n\\nIn this case the implementation will depend on the [language support](https://nixos.org/manual/nixpkgs/stable/#chap-language-support).\\n\\nWe can always use a `nix-shell` to build our application output, it will just not be _fully reproducible_.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Cleaning\\n\\nOften we install tools just because we would like to try them out in a project, and it turns out we will not use it again.\\n\\nThe command [`nix-collect-garbage`](https://nixos.org/manual/nix/stable/command-ref/nix-collect-garbage.html) will take care of that as it will make sure all our old non-used packages will be removed from our machine.\"}]},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this! \\n\\nIf you are curious on how I use nix for my personal projects just go ahead and check out [the repository for my website](https://github.com/MarcoDaniels/website), there's plenty examples of Nix.\\n\\nUntil then!\"}]}],\"_modified\":1668868657},{\"title\":\"elm robots and humans\",\"url\":\"/note/elm-robots-and-humans\",\"description\":\"Building type-safe and structured robots.txt and humans.txt files with Elm.\",\"image\":{\"path\":\"/2022/12/13/elm-robots-humans_uid_6398d558df40f.jpg\",\"title\":\"elm-robots-humans.jpg\",\"mime\":\"image/jpeg\",\"width\":2648,\"height\":1488},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Elm Robots and Humans\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"Humans build websites using a vast amount of tools and technologies. [Elm](https://elm-lang.org/) is a functional programing language that can build reliable websites. [Robots](https://moz.com/learn/seo/robotstxt) crawl websites and gather useful information for search engines.\\n\\nIn this note we will try to understand and build a `robots.txt` file content and a `humans.txt` file content using Elm.\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2022/12/13/elm-robots-humans_uid_6398d558df40f.jpg\",\"title\":\"elm-robots-humans.jpg\",\"mime\":\"image/jpeg\",\"width\":2648,\"height\":1488}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> Humans are odd. They think order and chaos are somehow opposites and try to control what won't be. But there is grace in their failings. \\n>\\n> -- Vision, Avengers: Age of Ultron\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Robots.txt\\n\\n[Robots.txt](https://moz.com/learn/seo/robotstxt) is a public file in our websites where we can define policies, sitemaps and host name to let crawlers know where, when and what they can access and index in search engines.\\n\\nA `robots.txt` file can look something like this:\\n\\n```\\nUser-agent: *\\nAllow: *\\n\\nSitemap: https://marcodaniels.com/sitemap.xml\\n\\nHost: https://marcodaniels.com\\n```\\n\\nThis information will allow all robots (`User-agent: *`) to access all pages (`Allow: *`) in this website. It also points to where we can find the sitemap.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Policies\\n\\nIn our `robots.txt` we can define multiple policies for multiple `user-agents`.\\n\\nIn this example we can disallow the page `/search` just for the `Googlebot` and for `Bingbot` we disallow all pages in our website. At the end we make sure to allow all the other crawlers in all our pages.\\n\\n```\\nUser-agent: Googlebot\\nDisallow: /search\\n\\nUser-agent: Bingbot\\nDisallow: /\\n\\nUser-agent: *\\nAllow: *\\n```\\n\\n\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Crawl-Delay\\n\\n`Crawl-delay` informs crawlers to wait a specific amount of time (in milliseconds) before they can start crawling our pages.\\n\\n```\\nUser-agent: Googlebot\\nCrawl-delay: 120\\nDisallow: /search\\n```\\n\\nThis directive can be used per user-agent.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Clean-Param\\n\\n`Clean-param` tells crawlers to _remove_ parameter(s) from the URL's [query string](https://en.wikipedia.org/wiki/Query_string).\\n\\n```\\nUser-agent: *\\nAllow: *\\nClean-param: id /user\\n```\\n\\nThis will remove the `id` parameter from the URL `.../user?id=1234`\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Humans.txt\\n\\n[Humans.txt](https://humanstxt.org/) is a fun initiative where we can introduce the people behind our website, inform what technologies and standards we follow and provide acknowledgements and greetings for the humans who build the website.\\n\\n```\\n/* Team */\\nEngineer: Marco Martins\\n\\n/* Technology */\\nElm, Terraform, Nix\\n```\\n\\nThe `humans.txt` file does not have a defined structure behind, and it can have many formats and different information as it is a file from humans to humans. \"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## elm-robots-humans\\n\\n[elm-robots-humans](https://package.elm-lang.org/packages/marcodaniels/elm-robots-humans/latest) is an Elm package that allows us to write `robots.txt` and `humans.txt` file contents in a structured and typed manner.\\n\\nThe `Robots` module exposes multiple functions and types that allows us to write policies per user-agent with all the needed directives.\\n\\n```\\nrobots: String\\nrobots =\\n    Robots.robots\\n        { sitemap = Robots.SingleValue \\\"/sitemap.xml\\\"\\n        , host = \\\"https://marcodaniels.com\\\"\\n        , policies =\\n            [ Robots.policy\\n                { userAgent = Robots.SingleValue \\\"*\\\"\\n                , allow = Just (Robots.SingleValue \\\"*\\\")\\n                , disallow = Nothing\\n                } |> Robots.withCrawlDelay 120\\n            ]\\n        }\\n```\\n\\nBecause some properties (`sitemap, userAgent, allow, disallow`) can be single or multiple valued string entry we use a [`Value` custom type](https://guide.elm-lang.org/types/custom_types.html) that allows us to be more expressive about our policy needs. The example above will generate the following `string`:\\n\\n```\\nUser-agent: *\\nAllow: *\\nCrawl-delay: 120\\n\\nSitemap: /sitemap.xml\\n\\nHost: https://marcodaniels.com\\n```\\n\\nFor the `humans.txt` side the `Humans` module allow us to write each \\\"section\\\" with just `headline` and `content`:\\n\\n```\\nhumans: String\\nhumans =\\n    Humans.humans\\n        [ { headline = \\\"Team\\\"\\n          , content = [ \\\"Engineer: Marco Martins\\\" ]\\n          }\\n        , { headline = \\\"Technology\\\"\\n          , content = [ \\\"Elm, Terraform, Nix\\\" ]\\n          }\\n        ]\\n```\\n\\nSince the `humans.txt` content does not require much structure, this allows us to make sure we have an easy way to create humans content. The example would generate the `string`:\\n\\n```\\n/* Team */\\nEngineer: Marco Martins\\n\\n/* Technology */\\nElm, Terraform, Nix\\n```\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this!\\n\\nGo ahead and check the [elm-robots-humans package](https://package.elm-lang.org/packages/marcodaniels/elm-robots-humans/latest) and its [source code in GitHub](https://github.com/MarcoDaniels/elm-robots-humans).\\n\\nYou can also see it in action in this website at [`/robots.txt`](https://marcodaniels.com/robots.txt) and the respective [source code in Github](https://github.com/MarcoDaniels/website/blob/main/src/Api.elm#L18).\\n\\nUntil then!\"}]}],\"_modified\":1670961567},{\"title\":\"elm AWS CloudFront\",\"url\":\"/note/elm-aws-cloudfront\",\"description\":\"Building AWS Lambda@Edge functions in CloudFront with Elm. \",\"image\":{\"path\":\"/2024/01/20/elm-aws-cloudfront_uid_65abe6a790a66.jpg\",\"title\":\"elm-aws-cloudfront.jpg\",\"mime\":\"image/jpeg\",\"width\":2720,\"height\":2304},\"content\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"# Elm AWS CloudFront\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"[Elm](https://elm-lang.org/) is a functional programming language that compiles to `JavaScript`. AWS CloudFront is a content delivery network that can run `JavaScript` functions _at the edge of the network_ and customize the user request and response events.\\n\\nIn this note we will build Lambda@Edge functions in CloudFront using `Elm`.\"},{\"field\":{\"type\":\"asset\",\"label\":\"Image\"},\"value\":{\"path\":\"/2024/01/20/elm-aws-cloudfront_uid_65abe6a790a66.jpg\",\"title\":\"elm-aws-cloudfront.jpg\",\"mime\":\"image/jpeg\",\"width\":2720,\"height\":2304}}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"> Yeah, yeah, but your scientists were so preoccupied with whether or not they could that they didn't stop to think if they should.\\n> \\n> -- Dr. Ian Malcolm, Jurassic Park\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## AWS CloudFront\\n\\n[AWS CloudFront](https://aws.amazon.com/cloudfront/) is a content delivery network (CDN) that can route user requests to defined origins such as [S3 Bucket](https://aws.amazon.com/s3/) or an HTTP server.\\n\\nIt speeds the distribution of our static or dynamic content like `.html` pages, `.js` files, images and other assets. \"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## AWS Lambda@Edge\\n\\n[AWS Lambda@Edge](https://aws.amazon.com/lambda/edge/) are lambda functions that allows us to run computations and customize CloudFront request and response events. As examples, we can enrich the response headers, forward the request to an authenticated origin, redirect the response to a different location.\\n\\nAWS Lambda@Edge supports both `Node.js` and `Python`.\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Elm Headless Worker\\n\\nIn one of our previous notes [\\\"elm headless worker\\\"](https://marcodaniels.com/note/elm-headless-worker) we created a simple request/response HTTP endpoint using `Elm` with ports and a little `JavaScript` snippet to run on the `Node.js` platform.\\n\\nSince Lambda@Edge is a simple handler with a CloudFront event object and a callback function, we can source all the logic into `Elm` via ports:\\n\\n```\\nconst app = Elm.MyModule.init();\\nexports.handler = (event, context, callback) => {\\n    const caller = (output) => {\\n        callback(null, output);\\n        app.ports.outputEvent.unsubscribe(caller);\\n    }\\n    // listen to Elm output and pass it to callback \\n    app.ports.outputEvent.subscribe(caller);\\n    // pass CloudFront to Elm\\n    app.ports.inputEvent.send(event);\\n}\\n```\\n\\nIn this snippet we're passing the entire `event` object into `Elm` and when we receive a response we trigger the callback with the output data, this way all the custom logic we can do in a Lambda@Edge can be done in _just_ `Elm`.\\n\\n\\n\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Using elm-aws-cloudfront Package\\n\\nGiven the complexity of the `event` object passed into `Elm` and the output callback, we have to create a set of encoders, decoders and handlers for the different origins, for that we created the Elm package [`marcodaniels/elm-aws-cloudfront`](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/latest/).\\n\\nWith this package we can set the response cache header with the following example:\\n\\n```\\nmain : Program () (Model ()) Msg\\nmain =\\n  cloudFront\\n    ( originResponse\\n      (\\\\{ response, request } _ ->\\n        response\\n          |> withHeader { key = \\\"cache-control\\\", value = \\\"public, max-age=100\\\" }\\n          |> toResponse\\n      )\\n    )\\n    ( inputEvent, outputEvent )\\n```\\n\\nLet's dive into more details on how this package is structured and can help us building Lambda@Edge functions.\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## CloudFront Module\\n\\nThe [CloudFront module](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/1.0.0/CloudFront) provides the _\\\"main\\\"_ function of our application as `cloudFront` and its definition looks like:\\n\\n```\\ncloudFront :\\n  (flags -> Maybe InputOrigin -> OutputEvent)\\n  -> ( (Decode.Value -> Msg) -> Sub Msg, Encode.Value -> Cmd Msg )\\n  -> Program flags (Model flags) Msg\\n```\\n\\nIt requires a function to map the origin event into a result output (Lambda Module) and a tuple of input and output [ports](https://guide.elm-lang.org/interop/ports) `( inputEvent, outputEvent )` with the correspondent types `((Decode.Value -> Msg) -> Sub Msg, Encode.Value -> Cmd Msg)`.\\n\\nThe origin mapping function can take in some [initial flags](https://guide.elm-lang.org/interop/flags), this can be used to pass some default values and/or environment variables.\\n\\nIn the end it _just_ returns an [Elm Worker](https://marcodaniels.com/note/elm-headless-worker#elm-worker).\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Lambda Module\\n\\nIn the [CloudFront Lambda module](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/1.0.0/CloudFront-Lambda) we can use the `originRequest` and `originResponse` functions to map and customize the origin event and `toRequest` and `toResponse` functions to transform the event into a result output.\\n\\n```\\noriginRequest\\n  (\\\\{ request } _ ->\\n    { request | uri = \\\"new\\\" }\\n      |> toRequest\\n  )\\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Headers Module\\n\\nThe [CloudFront Header module](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/1.0.0/CloudFront-Header) exposes the functions `withHeader` and `withHeaders` to add or update [HTTP headers](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers) on the origin event. In the case if the header already exists it will be the last entry value that \\\"wins\\\".\\n\\n```\\nresponse |> withHeaders\\n  [ { key = \\\"x-frame-options\\\", value = \\\"DENY\\\" }\\n  , { key = \\\"x-content-type-options\\\", value = \\\"nosniff\\\" }\\n  , { key = \\\"x-xss-protection\\\", value = \\\"1; mode=block\\\" }\\n  ]\\n```\"}]},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## Elm immutable values\\n\\nIn some [Lambda@Edge example functions](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-examples.html) we can see objects like request, response and headers being directly accessed and modified into the `callback` function.\\n\\n```\\nexports.handler = (event, context, callback) => {\\n\\tconst request = event.Records[0].cf.request;\\n \\tconst headerName = 'Auth-Header'\\n\\t// direct update to \\\"request.headers[...]\\\"\\n\\trequest.headers[headerName.toLowerCase()] = ...\\n\\t// direct update to \\\"request.querystring\\\"\\n\\trequest.querystring = ...;\\n\\t\\n\\tcallback(null, request);\\n};\\n```\\n\\nThis is **not allowed** in `Elm`, as all values in Elm are [immutable](https://developer.mozilla.org/en-US/docs/Glossary/Immutable) we have to create a new return object - the functions `withHeader` and `withHeaders` handle that by default. \\n\\nTo create the same example as above with `Elm`:\\n\\n```\\noriginRequest\\n  (\\\\{ request } _ ->\\n    -- returning the original \\\"request\\\" object\\n\\t-- assigning a new value to the \\\"querystring\\\" property\\n\\t{ request | querystring = Just \\\"...\\\" }\\n\\t  -- adding new header\\n\\t  |> withHeader {key = \\\"auth-header\\\", value = \\\"...\\\" }\\n\\t  |> toRequest\\n  )       \\n```\"},{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"\\n \\n## Building elm-aws-cloudfront applications\\n\\nThe [package \\\"elm-aws-cloudfront\\\"](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/1.0.0/) requires the clients to setup and export a `JavaScript` handler together with the bundled `Elm` output, so it can be executed in the `Node.js` platform in Lambda@Edge.\\n\\nTo ease this process we've created a [Nix derivation](https://nixos.org/manual/nix/stable/language/derivations.html) that can compile the `Elm` code, include the `JavaScript` handler and bundle its contents into one single `.js` file to be [deployed into Lambda@Edge](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-edge-how-it-works-tutorial.html).\\n\\nIn the following example we are building and bundling two Lambda@Edge handlers:\\n```\\ncloudfront.buildElmAWSCloudFront {\\n  src = ./.;\\n  elmSrc = ./elm-srcs.nix;\\n  elmRegistryDat = ./registry.dat;\\n  lambdas = [\\n    { module = ./src/MyModuleOne.elm; }\\n    {\\n      module = ./src/MyModuleTwo.elm;\\n      flags = [ ''token:\\\"token-here\\\"'' ''url:\\\"url-here\\\"'' ];\\n    }\\n  ];\\n}\\n```\\n\\nThe Nix derivation also allows us to pass initial [flags](https://guide.elm-lang.org/interop/flags) into the `Elm` module.\\n\\nIn order for the derivation to build, it requires `elm-srcs.nix` and `registry.dat` files to be generated with [elm2nix](https://github.com/cachix/elm2nix) and the `Elm` ports definition to be:\\n\\n```\\nport inputEvent : (Decode.Value -> msg) -> Sub msg\\n\\nport outputEvent : Encode.Value -> Cmd msg\\n```\\n\\nAll the updates to the Nix derivation are released with the `nix-...` prefix in the [elm-aws-cloudfront GitHub repository](https://github.com/MarcoDaniels/elm-aws-cloudfront/tags).\\n\"},{\"field\":{\"type\":\"repeater\",\"label\":\"Grid\"},\"value\":[{\"field\":{\"type\":\"markdown\",\"label\":\"Text\"},\"value\":\"## You're still here?\\n\\nThank you so much for reading this!\\n\\nCreating [`elm-aws-cloudfront v1`](https://package.elm-lang.org/packages/marcodaniels/elm-aws-cloudfront/1.0.0/) has been quite a journey of many doubts. As the first version it covers most use cases of a Lambda@Edge but, we will definitely keep working on other improvements. \\n\\nThis exact website we're looking at is using `elm-aws-cloudfront` to handle all the `.html` and `.js` files as well as all the images, you can see the implementation [in GitHub](https://github.com/MarcoDaniels/website/tree/80c428e9c35f08d41e954630743d584febc01326/infrastructure/lambda).\\n\\nUntil then!\"}]}],\"_modified\":1705870073}]}","956381014":"{\"site\":{\"title\":\"MarcoDaniel's\",\"description\":\"Hi, I am Marco and I like to build stuff.\",\"baseURL\":\"https://marcodaniels.com\"},\"navigation\":{\"brand\":{\"title\":\"MarcoDaniels\",\"url\":\"/\"},\"menu\":[{\"value\":{\"title\":\"About\",\"url\":\"/about\"}},{\"value\":{\"title\":\"Notes\",\"url\":\"/notes\"}}]},\"social\":{\"links\":[{\"value\":{\"title\":\"MarcoDaniels GitHub\",\"url\":\"https://github.com/MarcoDaniels\",\"social\":\"github\"}},{\"value\":{\"title\":\"MarcoDaniels Stack Overflow\",\"url\":\"https://stackoverflow.com/users/3708153/marco-daniel\",\"social\":\"stackoverflow\"}},{\"value\":{\"title\":\"MarcoDaniels LinkedIn\",\"url\":\"https://www.linkedin.com/in/marcodanielmartins/\",\"social\":\"linkedin\"}},{\"value\":{\"title\":\"MarcoDaniels Twitter\",\"url\":\"https://twitter.com/iMarcoDaniels\",\"social\":\"twitter\"}}]},\"footer\":\"With great power comes technical debt.\"}"},"is404":false,"path":""}</script>
